name: Run Local JUnit 5 Test

on:
  workflow_dispatch:

jobs:
  run-maven-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Maven Test using Local Repository
        shell: cmd
        run: |
          mvn -Dmaven.repo.local=C:\Users\lasha13\.m2\repository -Dtest=SuitTest test
        working-directory: D:\projects\NewAppTesting
