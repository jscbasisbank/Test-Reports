name: Run Local Mobile Tests

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: [self-hosted, SOFT-26-207]
    steps:
      - name: Run Maven Test from Local Directory
        shell: pwsh
        run: |
          Set-Location "D:\projects\NewAppTesting"
          mvn test -Dtest=kotlinTests.test.SuitTest
