name: Automated Tests

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Select project to run'
        required: true
        default: 'gatling'
        type: choice
        options:
          - gatling
      users_count:
        description: 'Virtual Users count (for Gatling)'
        required: false
        default: '500'
        type: string
      duration_seconds:
        description: 'Ramp-up duration in seconds (for Gatling)'
        required: false
        default: '10'
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send API Request to Private Repo
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.project_name }}" == "gatling" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/dispatches \
              -d '{"ref":"main","inputs":{"users_count":"${{ github.event.inputs.users_count }}","duration_seconds":"${{ github.event.inputs.duration_seconds }}","timeout_minutes":"5"}}'
          fi

      - name: Wait and Check Test Status & Get Report Link
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          echo "Waiting for the test to start..."
          sleep 15
          
          MAX_ATTEMPTS=20
          ATTEMPT=1
          
          echo "Strict 5-minute timeout enforced ($MAX_ATTEMPTS attempts max)"
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Checking test status (Attempt $ATTEMPT of $MAX_ATTEMPTS)..."
            
            RUN_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/runs?per_page=1)
            
            STATUS=$(echo "$RUN_DATA" | jq -r '.workflow_runs[0].status')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.workflow_runs[0].conclusion')
            
            echo "Current Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [ "$STATUS" == "completed" ]; then
              if [ "$CONCLUSION" == "success" ]; then
                echo "✅ Test completed successfully!"
                
                sleep 5
                
                LATEST_LINK=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                  https://raw.githubusercontent.com/jscbasisbank/Test-Reports/main/README.md \
                  | grep -oE "https://jscbasisbank.github.io/Test-Reports/gatling-reports/[^\)]+" | head -n 1)
                
                echo "### 🚀 Gatling Test Report Generated!" >> $GITHUB_STEP_SUMMARY
                echo "ტესტი წარმატებით დასრულდა. HTML რეპორტის სანახავად დააჭირეთ ქვემოთ მოცემულ ბმულს:" >> $GITHUB_STEP_SUMMARY
                echo "[🔗 Open HTML Report]($LATEST_LINK)" >> $GITHUB_STEP_SUMMARY
                
                exit 0
              else
                echo "❌ Test finished with conclusion: $CONCLUSION"
                echo "### ❌ Gatling Test Failed" >> $GITHUB_STEP_SUMMARY
                echo "ტესტი დასრულდა შეცდომით. გთხოვთ გადაამოწმოთ ლოგები." >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi
            
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "### ⏳ 5-წუთიანი ლიმიტი ამოიწურა!" >> $GITHUB_STEP_SUMMARY
          echo "ტესტმა ვერ მოასწრო დასრულება" >> $GITHUB_STEP_SUMMARY
          exit 1
