name: Automated Tests

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Select project to run'
        required: true
        default: 'gatling'
        type: choice
        options:
          - gatling
      users_count:
        description: 'Virtual Users count'
        required: true
        default: '500'
        type: choice
        options:
          - '100'
          - '300'
          - '500'
          - '1000'
      duration_seconds:
        description: 'Ramp-up duration in seconds'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '30'
          - '60'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send API Request to Private Repo
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          DISPATCH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "DISPATCH_TIME=$DISPATCH_TIME" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.project_name }}" == "gatling" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/dispatches \
              -d '{"ref":"main","inputs":{"users_count":"${{ github.event.inputs.users_count }}","duration_seconds":"${{ github.event.inputs.duration_seconds }}"}}'
          fi

      - name: Wait and Check Test Status & Get Report Link
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          DISPATCH_TIME: ${{ steps.dispatch.outputs.DISPATCH_TIME }}
        run: |
          echo "Waiting for the test to start..."
          sleep 15
          
          MAX_ATTEMPTS=20
          ATTEMPT=1
          TARGET_RUN_ID=""
          
          echo "Searching for the newly triggered workflow run..."
          
          # 1. ჯერ ვპოულობთ ზუსტად ჩვენი გაშვების Run ID-ს (პირველი ვარიანტის უსაფრთხოება)
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            RUN_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/runs?per_page=5)
            
            TARGET_RUN_ID=$(echo "$RUN_DATA" | jq -r --arg d "$DISPATCH_TIME" '.workflow_runs[] | select(.created_at >= $d) | .id' | head -n 1)
            
            if [ -n "$TARGET_RUN_ID" ] && [ "$TARGET_RUN_ID" != "null" ]; then
              echo "✅ Found Target Run ID: $TARGET_RUN_ID"
              break
            fi
            
            echo "Attempt $ATTEMPT: Test run not yet visible, waiting..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ -z "$TARGET_RUN_ID" ] || [ "$TARGET_RUN_ID" == "null" ]; then
            echo "❌ Could not find the triggered workflow run within the time limit."
            echo "### ❌ Gatling Test Failed" >> $GITHUB_STEP_SUMMARY
            echo "ვორქფლოუ ვერ მოიძებნა ან API-მ დააგვიანა." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Target Run ID successfully located: $TARGET_RUN_ID"
          
          # 2. ახლა უკვე ზუსტად ვიცით ID და ვუცდით მის დასრულებას (მეორე ვარიანტის ლოგიკა)
          ATTEMPT=1
          echo "Strict 5-minute timeout enforced ($MAX_ATTEMPTS attempts max)"
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Checking test status for Run ID $TARGET_RUN_ID (Attempt $ATTEMPT of $MAX_ATTEMPTS)..."
            
            RUN_STATUS_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/runs/$TARGET_RUN_ID)
            
            STATUS=$(echo "$RUN_STATUS_DATA" | jq -r '.status')
            CONCLUSION=$(echo "$RUN_STATUS_DATA" | jq -r '.conclusion')
            
            echo "Current Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [ "$STATUS" == "completed" ]; then
              if [ "$CONCLUSION" == "success" ]; then
                echo "✅ Test completed successfully!"
                
                sleep 5
                
                LATEST_LINK=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                  https://raw.githubusercontent.com/jscbasisbank/Test-Reports/main/README.md \
                  | grep -oE "https://jscbasisbank.github.io/Test-Reports/gatling-reports/[^\)]+" | head -n 1)
                
                echo "### 🚀 Gatling Test Report Generated!" >> $GITHUB_STEP_SUMMARY
                echo "ტესტი წარმატებით დასრულდა. HTML რეპორტის სანახავად დააჭირეთ ქვემოთ მოცემულ ბმულს:" >> $GITHUB_STEP_SUMMARY
                echo "[🔗 Open HTML Report]($LATEST_LINK)" >> $GITHUB_STEP_SUMMARY
                
                exit 0
              else
                echo "❌ Test finished with conclusion: $CONCLUSION"
                echo "### ❌ Gatling Test Failed" >> $GITHUB_STEP_SUMMARY
                echo "ტესტი დასრულდა შეცდომით. გთხოვთ გადაამოწმოთ ლოგები." >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi
            
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "### ⏳ 5-წუთიანი ლიმიტი ამოიწურა!" >> $GITHUB_STEP_SUMMARY
          echo "ტესტმა ვერ მოასწრო დასრულება" >> $GITHUB_STEP_SUMMARY
          exit 1
