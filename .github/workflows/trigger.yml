name: Automated Tests

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Select project to run'
        required: true
        default: 'gatling'
        type: choice
        options:
          - gatling
      users_count:
        description: 'Virtual Users count (for Gatling)'
        required: false
        default: '500'
        type: string
      duration_seconds:
        description: 'Ramp-up duration in seconds (for Gatling)'
        required: false
        default: '10'
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Private Repo
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.project_name }}" == "gatling" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/dispatches \
              -d '{"ref":"main","inputs":{"users_count":"${{ github.event.inputs.users_count }}","duration_seconds":"${{ github.event.inputs.duration_seconds }}"}}'
          fi

      - name: Wait and Check Test Status & Get Report Link
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          echo "Waiting for the test to start..."
          sleep 15
          
          MAX_ATTEMPTS=12
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Checking test status (Attempt $ATTEMPT of $MAX_ATTEMPTS)..."
            
            RUN_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/jscbasisbank/MobileAppPerformanceTesting/actions/workflows/gatling-test.yml/runs?per_page=1)
            
            STATUS=$(echo "$RUN_DATA" | jq -r '.workflow_runs[0].status')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.workflow_runs[0].conclusion')
            
            echo "Current Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [ "$STATUS" == "completed" ]; then
              if [ "$CONCLUSION" == "success" ]; then
                echo "✅ Test completed successfully!"
                
                sleep 5
                
                LATEST_LINK=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                  https://raw.githubusercontent.com/jscbasisbank/Test-Reports/main/README.md \
                  | grep -oE "https://jscbasisbank.github.io/Test-Reports/gatling-reports/[^\)]+" | head -n 1)
                
                echo "===================================================="
                echo " 🚀 GATLING TEST REPORT SUCCESSFULLY GENERATED!"
                echo " Open HTML Report directly: $LATEST_LINK"
                echo "===================================================="
                
                exit 0
              else
                echo "❌ Test finished with conclusion: $CONCLUSION"
                exit 1
              fi
            fi
            
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          # თუ დრო ამოიწურა და ტესტი ისევ მიმდინარეობს (არ ჩაჭრილა)
          echo "===================================================="
          echo " ⏳ ტესტირება ჯერ კიდევ გრძელდება..."
          echo " თუ შედეგს ეკრანზე ვერ ხედავთ, შესაძლებელია ტესტი ჯერ კიდევ მუშაობს."
          echo " გადადით და შეამოწმეთ შედეგების გვერდი:"
          echo " 👉 Reports Link: https://github.com/jscbasisbank/Test-Reports"
          echo "===================================================="
          exit 0
