name: Automated Tests

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Select project to run'
        required: true
        default: 'gatling'
        type: choice
        options:
          - gatling
      users_count:
        description: 'Virtual Users count (for Gatling)'
        required: false
        default: '500'
        type: string
      duration_seconds:
        description: 'Ramp-up duration in seconds (for Gatling)'
        required: false
        default: '10'
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Private Repo
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.project_name }}" == "gatling" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/jscbasisbank/თქვენი_მთავარი_პროექტის_სახელი/actions/workflows/თქვენი_ვორქფლოვფაილის_სახელი.yml/dispatches \
              -d '{"ref":"main","inputs":{"users_count":"${{ github.event.inputs.users_count }}","duration_seconds":"${{ github.event.inputs.duration_seconds }}"}}'
          fi
